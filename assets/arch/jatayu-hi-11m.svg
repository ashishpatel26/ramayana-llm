<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Jatayu-hi-11M architecture diagram">
<title>Jatayu-hi-11M architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a2f27"/></marker>
<style>
text{font-family:'Times New Roman',Georgia,serif;fill:#2a1d14}
.t{text-anchor:middle;font-weight:600} .s{font-size:14px;fill:#6e5d50} .s:not([text-anchor]){text-anchor:middle}
.h{font-size:17px;font-weight:700} .v{text-anchor:end;font-size:14px;font-family:'Consolas','Courier New',monospace;fill:#2a1d14}
.f{font-size:15px;font-style:italic;fill:#2a1d14}
.ar{stroke:#3a2f27;stroke-width:1.6;fill:none}
.res{stroke:#d9661f;stroke-width:1.8;fill:none;stroke-dasharray:7 6;animation:flow 1.2s linear infinite}
.tie{stroke:#2f3a7a;stroke-width:1.6;fill:none;stroke-dasharray:3 5}
.hl{stroke:#a84a16;stroke-width:1.6;opacity:.35;animation:pulse 2.6s ease-in-out infinite}
.dot{fill:#d9661f;filter:drop-shadow(0 0 6px #f08a45)}
.blk{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
.tok{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes pulse{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="900" fill="#fbf6ee"/>
<text x="40" y="44" font-size="28" font-weight="700" text-anchor="start">Jatayu-hi-11M <tspan font-family="'Nirmala UI','Mangal','Noto Sans Devanagari',serif" fill="#c45a1b">जटायु</tspan></text><text x="40" y="70" class="s" text-anchor="start" font-size="16">Decoder-only Transformer (Llama-style) · 11.4M parameters · tiny base model (pipeline smoke test)</text><text x="300" y="868" class="s" font-size="15">Inputs: <tspan font-family="'Nirmala UI','Mangal','Noto Sans Devanagari',serif">&lt;hi&gt; भारत की राजधानी …</tspan></text><line x1="300" y1="848" x2="300" y2="808" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:0ms"><rect x="170" y="762" width="260" height="44" rx="7" fill="#f6d7c3" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="780.0" class="t" font-size="17">Token Embedding</text><text x="300.0" y="799.0" class="s">32,000 × d</text></g><g class="blk" style="--d:150ms"><rect x="120" y="356" width="350" height="384" rx="14" fill="none" stroke="#3a2f27" stroke-width="1.2" stroke-dasharray="5 4"/><text x="96" y="552" class="t" font-size="22" font-style="italic">4×</text></g><line x1="300" y1="762" x2="300" y2="714" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:250ms"><rect x="170" y="680" width="260" height="34" rx="7" fill="#f5ecc8" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="703.0" class="t" font-size="16">RMSNorm</text></g><line x1="300" y1="680" x2="300" y2="650" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:350ms"><rect x="170" y="592" width="260" height="56" rx="7" fill="#f9c99a" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="616.0" class="t" font-size="16">Masked Multi-Head Self-Attention</text><text x="300.0" y="635.0" class="s">causal · RoPE · 4 heads</text></g><line x1="300" y1="592" x2="300" y2="572" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:450ms"><circle cx="300" cy="560" r="11" fill="#fff" stroke="#3a2f27" stroke-width="1.4"/><path d="M294 560H306M300 554V566" stroke="#3a2f27" stroke-width="1.6"/></g><line x1="300" y1="549" x2="300" y2="520" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:550ms"><rect x="170" y="486" width="260" height="34" rx="7" fill="#f5ecc8" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="509.0" class="t" font-size="16">RMSNorm</text></g><line x1="300" y1="486" x2="300" y2="456" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:650ms"><rect x="170" y="398" width="260" height="56" rx="7" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="422.0" class="t" font-size="16">SwiGLU Feed-Forward</text><text x="300.0" y="441.0" class="s">d → 704 → d</text></g><line x1="300" y1="398" x2="300" y2="384" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:750ms"><circle cx="300" cy="372" r="11" fill="#fff" stroke="#3a2f27" stroke-width="1.4"/><path d="M294 372H306M300 366V378" stroke="#3a2f27" stroke-width="1.6"/></g><path d="M300 740 H448 V560 H313" class="res" marker-end="url(#ah)"/><path d="M300 540 H448 V372 H313" class="res" marker-end="url(#ah)"/><line x1="300" y1="361" x2="300" y2="318" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:850ms"><rect x="170" y="284" width="260" height="34" rx="7" fill="#f5ecc8" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="307.0" class="t" font-size="16">Final RMSNorm</text></g><line x1="300" y1="284" x2="300" y2="254" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:950ms"><rect x="170" y="210" width="260" height="44" rx="7" fill="#e3d9f0" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="228.0" class="t" font-size="17">Linear (LM head)</text><text x="300.0" y="247.0" class="s">d → 32,000</text></g><line x1="300" y1="210" x2="300" y2="184" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:1050ms"><rect x="170" y="150" width="260" height="34" rx="7" fill="#d6ead2" stroke="#3a2f27" stroke-width="1.4"/><text x="300.0" y="173.0" class="t" font-size="16">Softmax</text></g><line x1="300" y1="150" x2="300" y2="124" class="ar" marker-end="url(#ah)"/><text x="300" y="112" class="s" font-size="15">next-token probabilities</text><path d="M430 784 C 520 784, 520 232, 430 232" class="tie"/><text x="524" y="512" class="s" transform="rotate(-90 524 512)">weights tied</text><line x1="146" y1="760" x2="146" y2="128" stroke="#eadfce" stroke-width="3"/><circle cx="146" cy="760" r="6" class="dot"><animateMotion path="M0 0 V-632" dur="4.5s" repeatCount="indefinite"/></circle><g class="blk" style="--d:300ms"><rect x="600" y="90" width="560" height="270" rx="12" fill="#fffdf9" stroke="#eadfce" stroke-width="1.5"/><text x="620" y="122" class="h" text-anchor="start">(a) Multi-head attention: 4 query heads, 4 key/value heads</text></g><line x1="700.0" y1="194" x2="700.0" y2="268" class="hl" style="animation-delay:0ms"/><line x1="820.0" y1="194" x2="820.0" y2="268" class="hl" style="animation-delay:120ms"/><line x1="940.0" y1="194" x2="940.0" y2="268" class="hl" style="animation-delay:240ms"/><line x1="1060.0" y1="194" x2="1060.0" y2="268" class="hl" style="animation-delay:360ms"/><circle cx="700.0" cy="182" r="13.0" fill="#f9c99a" stroke="#3a2f27" stroke-width="1.2"/><circle cx="820.0" cy="182" r="13.0" fill="#f9c99a" stroke="#3a2f27" stroke-width="1.2"/><circle cx="940.0" cy="182" r="13.0" fill="#f9c99a" stroke="#3a2f27" stroke-width="1.2"/><circle cx="1060.0" cy="182" r="13.0" fill="#f9c99a" stroke="#3a2f27" stroke-width="1.2"/><rect x="678.0" y="268" width="44" height="28" rx="5" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.2"/><rect x="798.0" y="268" width="44" height="28" rx="5" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.2"/><rect x="918.0" y="268" width="44" height="28" rx="5" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.2"/><rect x="1038.0" y="268" width="44" height="28" rx="5" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.2"/><text x="620" y="156" class="s" text-anchor="start">Q heads (d_head = 64)</text><text x="620" y="322" class="s" text-anchor="start">K/V heads</text><text x="1140" y="346" class="f" text-anchor="end">softmax(QKᵀ/√64 + M) V,  RoPE θ = 10,000</text><g class="blk" style="--d:500ms"><rect x="600" y="376" width="560" height="190" rx="12" fill="#fffdf9" stroke="#eadfce" stroke-width="1.5"/><text x="620" y="408" class="h" text-anchor="start">(b) SwiGLU feed-forward</text></g><g class="blk" style="--d:600ms"><rect x="620" y="446" width="130" height="40" rx="7" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.4"/><text x="685.0" y="462.0" class="t" font-size="15">W_gate</text><text x="685.0" y="481.0" class="s">256→704</text></g><g class="blk" style="--d:650ms"><rect x="620" y="506" width="130" height="40" rx="7" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.4"/><text x="685.0" y="522.0" class="t" font-size="15">W_up</text><text x="685.0" y="541.0" class="s">256→704</text></g><g class="blk" style="--d:700ms"><rect x="790" y="446" width="80" height="40" rx="7" fill="#f9c99a" stroke="#3a2f27" stroke-width="1.4"/><text x="830.0" y="472.0" class="t" font-size="15">SiLU</text></g><line x1="750" y1="466" x2="788" y2="466" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:750ms"><circle cx="920" cy="496" r="15" fill="#fff" stroke="#3a2f27" stroke-width="1.4"/><text x="920" y="502" class="t" font-size="18">⊙</text></g><path d="M870 466 H920 V479" class="ar" marker-end="url(#ah)"/><path d="M750 526 H920 V513" class="ar" marker-end="url(#ah)"/><g class="blk" style="--d:800ms"><rect x="970" y="476" width="130" height="40" rx="7" fill="#c9d3f2" stroke="#3a2f27" stroke-width="1.4"/><text x="1035.0" y="492.0" class="t" font-size="15">W_down</text><text x="1035.0" y="511.0" class="s">704→256</text></g><line x1="935" y1="496" x2="968" y2="496" class="ar" marker-end="url(#ah)"/><text x="1140" y="554" class="f" text-anchor="end">FFN(x) = W_down( SiLU(W_gate x) ⊙ W_up x )</text><g class="blk" style="--d:700ms"><rect x="600" y="582" width="560" height="264" rx="12" fill="#fffdf9" stroke="#eadfce" stroke-width="1.5"/><text x="620" y="614" class="h" text-anchor="start">(c) Configuration</text><text x="624" y="640" class="s" text-anchor="start">d_model</text><text x="1136" y="640" class="v">256</text><text x="624" y="664" class="s" text-anchor="start">Layers</text><text x="1136" y="664" class="v">4</text><text x="624" y="688" class="s" text-anchor="start">Heads (Q / KV)</text><text x="1136" y="688" class="v">4 / 4</text><text x="624" y="712" class="s" text-anchor="start">FFN dim</text><text x="1136" y="712" class="v">704</text><text x="624" y="736" class="s" text-anchor="start">Context</text><text x="1136" y="736" class="v">256 tokens</text><text x="624" y="760" class="s" text-anchor="start">Vocabulary</text><text x="1136" y="760" class="v">32,000 (SentencePiece Unigram)</text><text x="624" y="784" class="s" text-anchor="start">Parameters</text><text x="1136" y="784" class="v">11.4M</text><text x="624" y="808" class="s" text-anchor="start">Training tokens</text><text x="1136" y="808" class="v">33M</text><text x="624" y="832" class="s" text-anchor="start">Val loss / perplexity</text><text x="1136" y="832" class="v">4.68 / 107.5</text></g>
